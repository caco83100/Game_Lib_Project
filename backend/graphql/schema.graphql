"`Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")


type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by pseudo. Accepts SQL LIKE wildcards `%` and `_`."
      pseudo: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    "Find a library by its id (null if it does not exist)."
    library(id: ID!): Library

    "test pong"
    ping: String!
}

"""
Account of a person who uses this application.
"""
type User {
    id: ID!
    pseudo: String!
    email: String!
    created_at: DateTime!
    updated_at: DateTime!
}

type Library {
    id: ID!
    user_id: ID!
    title: String!
    is_default: Boolean!
    owned_games: [OwnedGame!]! @field(resolver: "App\\GraphQL\\Types\\Library\\OwnedGames")
}

type OwnedGame {
    id: ID!
    comment: String
    game: Game! @field(resolver: "App\\GraphQL\\Types\\OwnedGame\\GameOfCopy")
}

type Game {
    id: ID!
    title: String!
    platform: String!
    cover_url: String
}